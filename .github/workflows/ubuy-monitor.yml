name: Ubuy Monitor CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ubuy-monitor:v1 .

      - name: Run Ubuy Monitor
        run: docker run ubuy-monitor:v1 || true

      - name: Run Newman API Tests
        run: |
          npm install newman newman-reporter-htmlextra
          ./node_modules/.bin/newman run ubuy_api_tests.json -r cli,htmlextra --reporter-htmlextra-export ubuy_report.html

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-report
          path: ubuy_report.html
          if-no-files-found: ignore

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuy-monitor-logs
          path: "*.log"
          if-no-files-found: ignore